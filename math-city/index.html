<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math City</title><style>*{box-sizing:border-box}.retour-mathjeux{position:fixed;top:10px;left:10px;z-index:50;background:#ffda7b;color:#173447;font-weight:bold;font-size:16px;text-decoration:none;padding:8px 14px;border-radius:12px;box-shadow:0 3px 0 #0004}.retour-mathjeux:focus-visible{outline:3px solid #fff}body{margin:0;background:#102d43;color:white;font:20px system-ui}header{text-align:center;padding:15px;background:#164d68}h1{margin:0;color:#ffda7b}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px;background:#ffda7b;color:#173447;font-weight:bold}#niveaux{margin:22px auto 0;padding:0 16px}#menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:48px 54px;max-width:520px;margin:38px auto;padding:12px 24px}.tile{text-decoration:none;display:flex;flex-direction:column;overflow:hidden;background:#20516b;border-radius:15px;text-align:center;padding:0;color:white;box-shadow:0 5px 14px #0003;transition:transform .18s,box-shadow .18s;font-size:14px;font-weight:normal}.tile:hover{transform:translateY(-4px);box-shadow:0 9px 20px #0005}.tile:focus-visible{outline:3px solid white;outline-offset:4px}.tile img{display:block;width:100%;height:104px;object-fit:cover}.tile .topic{display:flex;align-items:center;justify-content:center;min-height:42px;padding:6px 8px;flex:1}.tile .band{display:block;width:100%;padding:9px 5px;background:#ffda7b;color:#173447;font-weight:bold;font-size:15px}@media(max-width:650px){#menu{grid-template-columns:repeat(2,minmax(0,1fr));gap:25px;max-width:450px}.tile img{height:100px}}@media(max-width:360px){#menu{grid-template-columns:1fr;max-width:270px}}#game{max-width:1100px;margin:auto;padding:12px}#hud{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}#scene{position:relative;height:min(65vh,580px);min-height:320px;background-size:cover;background-position:center;border-radius:20px;overflow:hidden;margin-top:10px}.answer{position:absolute;transform:translate(-50%,-50%);background:#fff5c9;border:3px solid #b87822;box-shadow:0 4px 10px #0008;min-width:75px;font-size:26px}.answer:disabled{opacity:.6}#hero{position:absolute;transform:translate(-50%,-50%);font-size:65px;pointer-events:none;filter:drop-shadow(0 4px 3px #0008)}#question{background:#fff3cc;color:#173447;padding:12px;border-radius:12px;text-align:center;font-size:25px;font-weight:bold;margin:10px 0}#msg{text-align:center;min-height:32px;font-weight:bold}#finish{text-align:center;padding:20px}select{font:inherit;padding:8px;border-radius:8px} [hidden]{display:none!important}</style><a class="retour-mathjeux" href="../mathematiques/index.html#dom-argent">← MathJeux</a><header><h1>Math City</h1>Les missions de la ville</header><div id="niveaux"></div><main id="menu"></main><script src="niveaux.js"></script><script>
