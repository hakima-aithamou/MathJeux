<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math City</title><style>*{box-sizing:border-box}body{margin:0;background:#102d43;color:white;font:20px system-ui}header{text-align:center;padding:15px;background:#164d68}h1{margin:0;color:#ffda7b}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px;background:#ffda7b;color:#173447;font-weight:bold}#menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;max-width:1100px;margin:20px auto;padding:12px}.tile{overflow:hidden;background:#20516b;border-radius:18px;text-align:center}.tile img{width:100%;height:180px;object-fit:cover}.tile button{width:100%;border-radius:0}.tile p{min-height:48px;margin:10px}#game{max-width:1100px;margin:auto;padding:12px}#hud{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}#scene{position:relative;height:min(65vh,580px);min-height:320px;background-size:cover;background-position:center;border-radius:20px;overflow:hidden;margin-top:10px}.answer{position:absolute;transform:translate(-50%,-50%);background:#fff5c9;border:3px solid #b87822;box-shadow:0 4px 10px #0008;min-width:75px;font-size:26px}.answer:disabled{opacity:.6}#hero{position:absolute;transform:translate(-50%,-50%);font-size:65px;pointer-events:none;filter:drop-shadow(0 4px 3px #0008)}#question{background:#fff3cc;color:#173447;padding:12px;border-radius:12px;text-align:center;font-size:25px;font-weight:bold;margin:10px 0}#msg{text-align:center;min-height:32px;font-weight:bold}#finish{text-align:center;padding:20px}select{font:inherit;padding:8px;border-radius:8px} [hidden]{display:none!important}</style><header><h1>Math City</h1>Les missions de la ville</header><main id="menu"></main><section id="game" hidden><div id="hud"><button id="home">← Quartiers</button><b id="level"></b><span id="score"></span><label>Déplacement <select id="mode"><option value="1">À pied</option><option value="1.6">Vélo</option><option value="2">Voiture virtuelle</option></select></label></div><div id="question"></div><div id="scene"><div id="hero">🚶</div></div><div id="msg" aria-live="polite"></div><div id="finish" hidden><button id="next">Quartier suivant →</button></div></section><script>
const $=id=>document.getElementById(id), names=['Le marché','La boulangerie','Le parc','Le supermarché','La gare','Le centre-ville'], topics=['Additionner des fruits','Soustraire des pâtisseries','Additionner et soustraire','Calculer des achats','Multiplier des billets','Partager et rendre la monnaie'];let l=0,n=0,correct=0,busy=false,token=0,x=50,y=85;const r=(a,b)=>a+Math.floor(Math.random()*(b-a+1));names.forEach((name,i)=>{let d=document.createElement('div');d.className='tile';d.innerHTML=`<img src="decor${i}.jpg" alt=""><p>${topics[i]}</p><button>${i+1} · ${name}</button>`;d.querySelector('button').onclick=()=>start(i);$('menu').append(d)});function start(i){token++;l=i;n=0;busy=false;$('menu').hidden=true;$('game').hidden=false;$('finish').hidden=true;$('level').textContent=names[i];$('scene').style.backgroundImage=`url(decor${i}.jpg)`;x=50;y=85;place();question()}function place(){$('hero').style.left=x+'%';$('hero').style.top=y+'%'}function question(){busy=false;$('score').textContent=`⭐ ${n}/10`;$('msg').textContent='Choisis la bonne réponse.';let a,b,q;if(l===0){a=r(1,8);b=r(1,10-a);correct=a+b;q=`${a} pommes + ${b} pommes = ?`}else if(l===1){a=r(3,10);b=r(1,a);correct=a-b;q=`${a} croissants − ${b} croissants = ?`}else if(l===2){a=r(5,15);b=r(1,5);let plus=r(0,1);correct=plus?a+b:a-b;q=`${a} oiseaux ${plus?'+':'−'} ${b} oiseaux = ?`}else if(l===3){a=r(2,20);b=r(2,20);correct=a+b;q=`Un achat de ${a} $ et un achat de ${b} $ : total ?`}else if(l===4){a=[2,5,10][r(0,2)];b=r(1,10);correct=a*b;q=`${b} billets à ${a} $ chacun : total ?`}else{b=r(2,5);a=r(2,10)*b;correct=a/b;q=`${a} $ partagés entre ${b} personnes : combien chacun ?`;if(r(0,1)){a=r(5,50);b=r(1,a);correct=a-b;q=`Tu paies ${a} $ pour un achat de ${b} $ : monnaie ?`}}$('question').textContent=q;document.querySelectorAll('.answer').forEach(e=>e.remove());let vals=new Set([correct]);while(vals.size<3)vals.add(Math.max(0,correct+r(-5,5)));let v=[...vals];for(let i=v.length-1;i>0;i--){let j=r(0,i);[v[i],v[j]]=[v[j],v[i]]}v.forEach((val,i)=>{let btn=document.createElement('button');btn.className='answer';let px=17+i*33+r(-4,4),py=r(42,69);btn.style.left=px+'%';btn.style.top=py+'%';btn.textContent=val+(l>=3?' $':'');btn.onclick=()=>choose(btn,val,px,py);$('scene').append(btn)})}function choose(btn,val,px,py){if(busy)return;busy=true;let t=token,sx=x,sy=y,start=performance.now(),duration=650/Number($('mode').value);function frame(now){if(t!==token)return;let f=Math.min(1,(now-start)/duration);x=sx+(px-sx)*f;y=sy+(py+12-sy)*f;place();if(f<1)requestAnimationFrame(frame);else{if(val===correct){n++;btn.remove();$('score').textContent=`⭐ ${n}/10`;$('msg').textContent='Bravo ! Mission réussie.';setTimeout(()=>{if(t!==token)return;if(n===10){document.querySelectorAll('.answer').forEach(e=>e.remove());$('finish').hidden=false;$('msg').textContent='Quartier terminé !'}else question()},650)}else{$('msg').textContent='Essaie encore.';btn.disabled=true;busy=false}}}requestAnimationFrame(frame)}$('mode').onchange=()=>{$('hero').textContent=({'1':'🚶','1.6':'🚲','2':'🚗'})[$('mode').value]};$('home').onclick=()=>{token++;$('game').hidden=true;$('menu').hidden=false};$('next').onclick=()=>{if(l<5)start(l+1);else $('home').click()};</script></html>
