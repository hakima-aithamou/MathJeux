</style></head><body><header><strong>🥐 Math City · Ma boulangerie</strong><div id="niveaux"></div><a href="index.html">← Accueil</a></header><main>
<div class="game" id="game"><img src="images/decors/boulangerie-3d.png" alt="Boulangerie et vitrine avec six pâtisseries à choisir">
<div id="porteMonnaie" class="porteMonnaie" hidden aria-live="polite"></div><div id="arrivalActors" class="integratedActors" aria-label="Enfants qui entrent dans la boulangerie"></div><div id="arrivalNotice" class="arrivalNotice" aria-live="polite">Bienvenue à la boulangerie !</div><button id="enter" hidden type="button">Entrer</button>

</main><script src="niveaux.js"></script><script>
const $=id=>document.getElementById(id);
const products=[['Biscuit','🍪',3],['Beignet','🍩',4],['Croissant','🥐',5],['Cupcake','🧁',4],['Gâteau','🍰',6],['Tarte','🥧',7]];
const zones=[ [72,17,10,17],[83,17,10,17],[93,17,7,17],[72,38,10,18],[83,38,10,18],[93,38,7,18] ];
let counts=Array(6).fill(0),client=0,started=false,voiceChoice=null,locked=false,choix=[],budget=20;
function speak(t){$('dialog').textContent=t;if(!('speechSynthesis' in window))return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.9;let vs=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('fr'));voiceChoice=voiceChoice||vs.find(v=>/henri|paul|antoine|thierry|male|homme/i.test(v.name))||vs[0]||null;if(voiceChoice)u.voice=voiceChoice;speechSynthesis.speak(u)}catch(e){}}
function total(){return counts.reduce((sum,n,i)=>sum+n*products[i][2],0)}
/* Each customer has a different amount of money (chosen at random) */
/* Level N: each child has at most 20, 30, 40, 50 or 60 $ */
const BUDGETS=MC_NIVEAU.montants();
function nouveauBudget(){budget=MC_NIVEAU.auHasard(budget)}
MC_NIVEAU.afficher($('niveaux'),k=>{location.href=location.pathname+'?niveau='+k});
function draw(){const n=counts.reduce((a,b)=>a+b,0);$('basketItems').textContent=counts.map((c,i)=>c?`${products[i][1]} × ${c}`:'').filter(Boolean).join('  ')||'Vide';$('sum').textContent=total()+' $';$('sumOverlay').textContent=total()+' $ / '+budget+' $';$('porteMonnaie').textContent='👛 Tu as '+budget+' $';$('checkout').disabled=n===0||locked;
const slots=$('cartSlots');slots.innerHTML='';let units=choix.map(i=>products[i][1]);units.slice(0,3).forEach((emoji,j)=>{const el=document.createElement('div');el.className='cartSlot';el.style.left=(17.5+j*10.5)+'%';el.textContent=emoji;slots.appendChild(el)});if(units.length>3){const extra=document.createElement('span');extra.style.cssText='position:absolute;left:44%;bottom:9%;background:#ffe9a1;border-radius:50%;padding:3px 8px;font-weight:900';extra.textContent='+'+(units.length-3);slots.append(extra)} }
function renderProducts(){const root=$('hotspots');root.innerHTML='';zones.forEach((z,i)=>{const b=document.createElement('button');b.className='pastryHotspot';b.style.left=z[0]+'%';b.style.top=z[1]+'%';b.style.width=z[2]+'%';b.style.height=z[3]+'%';b.setAttribute('aria-label',`Ajouter ${products[i][0]}, ${products[i][2]} dollars`);b.title=`${products[i][0]} · ${products[i][2]} $`;b.onclick=()=>add(i,b);root.append(b)})}
function add(i,button){if(locked)return;if(total()+products[i][2]>budget){speak('Tu as seulement '+budget+' dollars. Passe à la caisse !');return}
/* The pastry flies in an arc to its own place in the cart, stays visible, then appears there with a bounce. */
const start=button.getBoundingClientRect();const sx=start.left+start.width/2,sy=start.top+start.height/2;
counts[i]++;choix.push(i);draw();
const n=choix.length,slots=$('cartSlots');const cible=n<=3?slots.children[n-1]:slots.querySelector('span');
if(!cible||!document.body.animate||(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){if(cible)cible.classList.add('pop');return}
if(n<=3)cible.style.visibility='hidden';
const t=cible.getBoundingClientRect(),tx=t.left+t.width/2,ty=t.top+t.height/2,dx=tx-sx,dy=ty-sy;
const fly=document.createElement('div');fly.className='flyingPastry';fly.textContent=products[i][1];fly.style.left=(sx-35)+'px';fly.style.top=(sy-35)+'px';document.body.append(fly);
const taille=parseFloat(getComputedStyle(n<=3?cible:slots.children[0]||cible).fontSize)||40,k=Math.max(.35,Math.min(1,taille/62));
let done=false;function finish(){if(done)return;done=true;fly.remove();cible.style.visibility='';cible.classList.remove('pop');void cible.offsetWidth;cible.classList.add('pop')}
const anim=fly.animate([{transform:'translate(0,0) scale(1) rotate(0)'},{transform:`translate(${dx*.5}px,${Math.min(0,dy)*.4-90}px) scale(1.15) rotate(${dx>0?10:-10}deg)`,offset:.45},{transform:`translate(${dx}px,${dy}px) scale(${k}) rotate(0)`}],{duration:800,easing:'cubic-bezier(.35,.1,.25,1)',fill:'forwards'});
anim.onfinish=finish;setTimeout(finish,1100);
speak(products[i][0]+' ajouté au panier !')}
function setClient(n,garder){client=n;counts=Array(6).fill(0);choix=[];if(!garder){if(fileAttente[0])budget=fileAttente[0].budget;else nouveauBudget();}marquerClient();locked=false;draw();$('receipt').classList.remove('show');$('next').style.display='none';speak('Au tour du client '+(client+1)+' ! Tu as '+budget+' dollars. Choisis tes pâtisseries dans la vitrine.');}
function openShop(){if(started)return;started=true;$('shopUI').hidden=false;$('hotspots').hidden=false;$('cartSlots').hidden=false;$('sumOverlay').hidden=false;locked=false;if(fileAttente[0])budget=fileAttente[0].budget;else nouveauBudget();marquerClient();$('porteMonnaie').hidden=false;renderProducts();draw();speak('Bonjour ! Tu as '+budget+' dollars. Choisis tes pâtisseries directement dans la vitrine !')};
$('checkout').onclick=()=>{if($('checkout').disabled)return;locked=true;draw();$('receipt').classList.add('show');$('lines').innerHTML=products.map((p,i)=>counts[i]?`<div class="line"><strong>${p[1]} ${p[0]}</strong><span>${counts[i]} × ${p[2]} $</span><input type="number" min="0" data-i="${i}" aria-label="Prix total pour ${p[0]}"></div>`:'').join('');$('total').value='';$('feedback').textContent='';$('receipt').scrollIntoView({behavior:'smooth',block:'center'});speak('Voici ton ticket. Calcule le prix de chaque produit, puis le total.')};
$('verify').onclick=()=>{let ok=true;document.querySelectorAll('.line input').forEach(inp=>{let i=Number(inp.dataset.i),good=inp.value!==''&&Number(inp.value)===counts[i]*products[i][2];inp.style.borderColor=good?'#26966a':'#d34237';if(!good)ok=false});let good=$('total').value!==''&&Number($('total').value)===total();$('total').style.borderColor=good?'#26966a':'#d34237';if(ok&&good){$('feedback').textContent=`Bravo ! ${total()} $ dépensés. Avec ${budget} $, il reste ${budget-total()} $.`;$('next').style.display='inline-block';$('next').textContent=fileAttente.length<=1?'Recommencer la journée ↻':'Servir le client suivant →';speak('Bravo ! Le ticket est juste. Le client est servi !')}else{$('feedback').textContent='Vérifie les cases entourées en rouge.';speak('Regarde les montants en rouge et réessaie.')}};
$('next').onclick=()=>{servirSuivant();window.scrollTo({top:0,behavior:'smooth'})};
$('reset').onclick=()=>{setClient(client,true)};

/* ---------- Queue ----------
   The child at the front is served. When served, they walk out of the shop (to the right) and the others
   move up one place; the next child pays with their own money. After the last child, a new group comes in. */
let fileAttente=[];
function marquerClient(){walkers.forEach(a=>a.tag&&a.tag.classList.toggle('actif',a===fileAttente[0]));}
function marcher(actor,cibleX,fin){
 actor.el.classList.remove('atPlace');let prev=0;
 function pas(time){
  if(!actor.el.isConnected)return;
  if(!prev)prev=time;const dt=Math.min((time-prev)/1000,.05);prev=time;
  const W=$('arrivalActors').getBoundingClientRect().width||1200,H=actor.el.getBoundingClientRect().height||200;
  const longueur=Math.max(20,H*PAS_RELATIF),vitesse=longueur*1.6;
  const x=parseFloat(actor.el.style.left)||0,restePx=(cibleX-x)/100*W;
  if(restePx<=.5){actor.el.style.left=cibleX+'%';actor.img.src=actor.still.src;actor.el.classList.add('atPlace');if(fin)fin();return}
  const d=Math.min(restePx,vitesse*dt);actor.travel+=d;actor.el.style.left=(x+d/W*100)+'%';
  const f=Math.floor(actor.travel/longueur*NB_POSES)%NB_POSES;if(f!==actor.frame){actor.frame=f;actor.img.src=actor.frames[f].src}
  requestAnimationFrame(pas);
 }
 requestAnimationFrame(pas);
}
function servirSuivant(){
 $('next').style.display='none';locked=true;
 const servi=fileAttente.shift();
 if(servi){servi.tag.textContent='😊 Merci !';servi.tag.classList.remove('actif');marcher(servi,118,()=>servi.el.remove());}
 if(!fileAttente.length){speak('Tous les clients sont servis ! Voici un nouveau groupe.');setTimeout(()=>{counts=Array(6).fill(0);choix=[];draw();$('receipt').classList.remove('show');$('arrivalNotice').style.opacity='1';beginArrival()},1800);return}
 let restants=fileAttente.length;
 fileAttente.forEach((a,k)=>marcher(a,stops[k],()=>{if(--restants===0)setClient(client+1)}));
}

// Walk images are loaded before the start to avoid jerks.
const walkers=[];
const stops=[43,29,15,1]; // positions in % of the setting
/* Walk cycle: 5 poses (contact, push-off, lift, swing, passing), aligned on the body.
   One cycle is one step, and its length follows the child's size on screen, so the feet do not slide. */
const NB_POSES=5;
const PAS_RELATIF=.42; // step length = 42 % of the child's height
function beginArrival(){
 const stage=$('arrivalActors');stage.innerHTML='';
 walkers.length=0;locked=true;
 for(let i=0;i<4;i++){
  const w=document.createElement('div');w.className='integratedWalker';
  w.style.left='-22%';w.style.opacity='0';
  const img=document.createElement('img');img.alt='';
  const base=`images/personnages/enfant${i+1}`;
  const frames=Array.from({length:NB_POSES},(_,j)=>{const pic=new Image();pic.src=`${base}-pas${j}.png`;return pic});
  const still=new Image();still.src=`${base}-debout.png`;
  img.src=still.src;w.append(img);stage.append(w);
  // each child has their own money, shown above the head
  const argent=BUDGETS[Math.floor(Math.random()*BUDGETS.length)];
  const tag=document.createElement('div');tag.className='argentEnfant';tag.textContent='👛 '+argent+' $';w.append(tag);
  walkers.push({el:w,img,frames,still,tag,budget:argent,target:stops[i],index:i,started:false,finished:false,travel:0,frame:-1});
 }
 // One loop moves the child and changes the pose together.
 let previous=0;
 function tick(time){
  if(!previous)previous=time;
  const dt=Math.min((time-previous)/1000,.05);previous=time;
  const sceneWidth=stage.getBoundingClientRect().width||1200;
  let allFinished=true;
  walkers.forEach((actor,i)=>{
   if(actor.finished)return;
   allFinished=false;
   const startAt=350+i*2450;
   if(time-animationStart<startAt)return;
   if(!actor.started){actor.started=true;actor.el.style.opacity='1';actor.el.dataset.walking='true'}
   const targetX=sceneWidth*actor.target/100;
   const currentX=-sceneWidth*.22+actor.travel;
   const distanceLeft=Math.max(0,targetX-currentX);
   const vitesse=Math.max(20,actor.el.getBoundingClientRect().height*PAS_RELATIF)*1.6; // about 1.6 steps per second
   const move=Math.min(distanceLeft,vitesse*dt);
   actor.travel+=move;
   const newX=-sceneWidth*.22+actor.travel;
   actor.el.style.left=(newX/sceneWidth*100)+'%';
   if(distanceLeft<=.5||move>=distanceLeft){
    actor.finished=true;actor.img.src=actor.still.src;actor.el.dataset.walking='false';
    actor.el.classList.add('atPlace');
   }else{
    const pas=Math.max(20,actor.el.getBoundingClientRect().height*PAS_RELATIF);
    const frame=Math.floor(actor.travel/pas*NB_POSES)%NB_POSES;
    if(frame!==actor.frame){actor.frame=frame;actor.img.src=actor.frames[frame].src}
   }
  });
  if(!allFinished)requestAnimationFrame(tick);
  else{$('arrivalNotice').style.opacity='0';fileAttente=walkers.slice();if(started)setClient(0);else openShop()}
 }
 const animationStart=performance.now();
 requestAnimationFrame(tick);
}
beginArrival();
</script></body></html>
