function say(t){$('msg').textContent=t;speak(t,/Bravo/.test(t))}function init(){counts=[0,0,0,0];paid=[];stage=0;$('products').replaceChildren();$('progress').textContent=`Niveau ${MC_NIVEAU.niveau} · Mission ${n+1} / 10`;nouveauBudget();$('mission').textContent='Achète '+missions[n].map((v,i)=>v?`${v} ${items[i][0].toLowerCase()}`:'').filter(Boolean).join(', ')+'.';$('wallet').textContent='Budget : '+budget+' $';$('totalInput').value='';$('changeInput').value='';render();say('Bonjour ! Bienvenue à mon marché. Tu as '+budget+' dollars. '+$('mission').textContent+' Choisis tes fruits, je suis là pour t’aider.')}function render(){ $('steps').innerHTML=['1. Choisir','2. Calculer','3. Payer','4. Monnaie','5. Terminé'].map((s,i)=>`<span class="${i===stage?'active':''}">${s}</span>`).join('');$('shop').hidden=stage!==0;$('cash').hidden=stage===0;$('calc').hidden=stage!==1;$('ticketActions').hidden=stage!==1;$('pay').hidden=stage!==2;$('change').hidden=stage!==3;$('done').hidden=stage!==4;$('checkout').hidden=stage!==0;$('back').hidden=stage!==1;if(!$('products').querySelector('.vendorLayer'))$('products').innerHTML=vendorMarkup()+items.map(([name,icon,price],i)=>`<button class="product" draggable="true" ondragstart="event.dataTransfer.setData('text/plain',''+${i})" onclick="pick(${i},this)" aria-label="Ajouter ${name}, ${price} dollars"><b>${name} · ${price} $</b></button>`).join('')+`<div class="note"><strong>Ma liste d’achats</strong><p>${missions[n].map((v,i)=>v?`${v} ${items[i][0].toLowerCase()}`:'').filter(Boolean).join('<br>')}</p>Budget : ${budget} $</div>`;animateVendor(vendorMode);$('basket').innerHTML=counts.flatMap((v,i)=>Array.from({length:v},()=>`<button class="basketFruit" onclick="removeFruit(${i})" ${stage!==0?'disabled':''} aria-label="Retirer ${items[i][0]}"><img src="${fruitImages[i]}" alt="${items[i][0]}"></button>`)).join('')||'Dépose tes fruits ici.';$('sum').textContent=stage>=2?`Total : ${total()} $`:`${counts.reduce((a,b)=>a+b,0)} article(s)`;$('tender').textContent=`Somme choisie : ${tender()} $`;$('undo').disabled=!paid.length;$('cashPrompt').textContent=stage===1?'Calcule le prix total de ton panier.':stage===2?'Le marchand attend ton paiement.':stage===3?'Le marchand te rend la monnaie.':'';renderTicket();}function renderTicket(){
 const ticket=$('ticket');ticket.hidden=stage!==1;
 if(stage!==1)return;
 $('ticketLines').innerHTML=items.map(([name,icon,price],i)=>counts[i]
 ? `<div class="ticketLine"><strong>${name}</strong><span>${counts[i]} × ${price} $</span><label class="lineAmount"><input id="lineAmount${i}" type="number" min="0" inputmode="numeric" aria-label="Montant pour ${name}"> $</label></div>`:'').join('');
}
function removeFruit(i){if(stage===0)add(i,-1)}/* The chosen fruit flies in an arc to its own place in the basket, then appears there with a small bounce. */
function pick(i,el){if(stage!==0||counts[i]>=10)return;
 let r=el.getBoundingClientRect();
 add(i,1);
 const places=$('basket').querySelectorAll(`.basketFruit[onclick="removeFruit(${i})"]`),cible=places[places.length-1];
 const calme=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
 if(!cible||calme||!document.body.animate){if(cible)cible.classList.add('arrive');}
 else{
  cible.style.visibility='hidden';
  const t=cible.getBoundingClientRect(),f=document.createElement('img');f.src=fruitImages[i];f.className='fly';
  const x0=r.left+r.width/2-35,y0=r.top+r.height/2-35,dx=t.left+t.width/2-35-x0,dy=t.top+t.height/2-35-y0;
  const k=Math.max(.4,Math.min(1,(t.height-8)/70)),haut=Math.min(160,60+Math.abs(dx)*.15);
  f.style.left=x0+'px';f.style.top=y0+'px';document.body.append(f);
  const vol=f.animate([
   {transform:'translate(0,0) scale(1) rotate(0)'},
   {transform:`translate(${dx*.5}px,${Math.min(0,dy)*.5-haut}px) scale(1.1) rotate(${dx>0?12:-12}deg)`,offset:.45},
   {transform:`translate(${dx}px,${dy}px) scale(${k}) rotate(0)`}],{duration:700,easing:'cubic-bezier(.35,.1,.25,1)',fill:'forwards'});
  const fin=()=>{f.remove();cible.style.visibility='';cible.classList.add('arrive');};
  vol.onfinish=fin;setTimeout(()=>{if(f.isConnected)fin()},900);
 }speak(["Une belle pomme !","Une banane, voilà !","Une orange bien juteuse !","Une jolie poire !"][i])}$('basket').ondragover=e=>e.preventDefault();$('basket').ondrop=e=>{e.preventDefault();let v=e.dataTransfer.getData('text/plain');if(/^[0-3]$/.test(v)&&stage===0)pick(+v,document.querySelectorAll('.product')[+v])};function add(i,d){counts[i]=Math.max(0,Math.min(10,counts[i]+d));render()}$('checkout').onclick=()=>{
  if(stage!==0)return;

};$('back').onclick=()=>{stage=0;render()};$('checkTotal').onclick=()=>{
 for(let i=0;i<items.length;i++){
  if(!counts[i])continue;

   if(el)el.focus();
   return say('Vérifie le montant pour '+items[i][0].toLowerCase()+'.');
  }
 }
 if($('totalInput').value===''||Number($('totalInput').value)!==total()){
  $('totalInput').focus();return say('Vérifie le total de tes achats.');
 }
 stage=2;render();say('Bravo ! Tu peux maintenant payer.');
};$('money').innerHTML=[1,2,5,10,20].map(v=>`<button class="${v<5?'coin':''}" onclick="money(${v})">${v} $</button>`).join('');function money(v){if(tender()+v>budget)return say('Ton portefeuille contient seulement '+budget+' $.');paid.push(v);render()}$('undo').onclick=()=>{paid.pop();render()};$('payBtn').onclick=()=>{if(tender()<total())return say('Il manque de l’argent pour payer.');stage=3;render();$('changePrompt').textContent=`Tu donnes ${tender()} $ pour un achat de ${total()} $. Combien doit-on te rendre ?`;$('changeInput').focus();say('Soustrais le prix du montant donné.')};$('checkChange').onclick=()=>{if($('changeInput').value===''||Number($('changeInput').value)!==tender()-total())return say('Essaie encore : montant donné − prix total.');stage=4;render();$('receipt').textContent=`Achats : ${total()} $ · Monnaie : ${tender()-total()} $ · Il te reste ${budget-total()} $.`;$('next').textContent=n===9?'Retour aux quartiers':'Mission suivante →';say('Ha ha ! Bravo, tu as très bien fait tes courses. Merci et à bientôt !')};$('next').onclick=()=>{if(n===9)location.href='index.html';else{n++;init()}};init();
